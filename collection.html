<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凤临朝：收藏图鉴</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- 游戏配置数据 -->
    <script src="game-data.js"></script>
    <script src="main.js"></script>
    
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #2F4F4F 0%, #1a1a1a 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.3;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        
        .title {
            background: linear-gradient(45deg, #D4AF37, #FFD700, #D4AF37);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }
        
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 0.5rem;
        }
        
        .tab-button {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.9), rgba(139, 0, 0, 0.8));
            border: 2px solid #D4AF37;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .tab-button.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.9), rgba(139, 69, 19, 0.8));
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .cg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .cg-item {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.95), rgba(139, 0, 0, 0.9));
            border: 2px solid #D4AF37;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .cg-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        }
        
        .cg-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .cg-item.locked:hover {
            transform: none;
            box-shadow: none;
        }
        
        .cg-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #D4AF37;
        }
        
        .cg-info {
            padding: 1rem;
        }
        
        .cg-title {
            color: #D4AF37;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .cg-description {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .cg-lock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #D4AF37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        .story-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .story-item {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.95), rgba(139, 0, 0, 0.9));
            border: 2px solid #D4AF37;
            border-radius: 10px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .story-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .story-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .story-item.locked:hover {
            transform: none;
            box-shadow: none;
        }
        
        .story-title {
            color: #D4AF37;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .story-meta {
            color: #ccc;
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
        }
        
        .story-preview {
            color: #fff;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        
        .stats-card {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.95), rgba(139, 0, 0, 0.9));
            border: 2px solid #D4AF37;
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .stats-number {
            color: #D4AF37;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .stats-label {
            color: #ccc;
            font-size: 1rem;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        
        .modal-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }
        
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #D4AF37;
            font-size: 2rem;
            cursor: pointer;
            background: rgba(0,0,0,0.8);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-button {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        
        .back-button:hover {
            background: rgba(212, 175, 55, 0.2);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .empty-state {
            text-align: center;
            color: #ccc;
            padding: 3rem;
            font-style: italic;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <img id="pageBackground" src="" alt="Background" class="background-image">
    
    <button class="back-button" onclick="window.location.href='index.html'">
        ← 返回主菜单
    </button>
    
    <div class="container">
        <h1 class="title">收藏图鉴</h1>
        
        <!-- 标签导航 -->
        <div class="tab-container">
            <button class="tab-button active" onclick="switchTab('cg')">CG图鉴</button>
            <button class="tab-button" onclick="switchTab('story')">剧情回顾</button>
            <button class="tab-button" onclick="switchTab('stats')">游戏统计</button>
        </div>
        
        <!-- CG图鉴标签页 -->
        <div id="cgTab" class="tab-content active">
            <div class="cg-grid" id="cgGrid">
                <!-- CG项目将在这里动态生成 -->
            </div>
        </div>
        
        <!-- 剧情回顾标签页 -->
        <div id="storyTab" class="tab-content">
            <div class="story-list" id="storyList">
                <!-- 剧情项目将在这里动态生成 -->
            </div>
        </div>
        
        <!-- 游戏统计标签页 -->
        <div id="statsTab" class="tab-content">
            <div class="stats-grid" id="statsGrid">
                <!-- 统计信息将在这里动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 模态框 -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <div class="modal-close" onclick="closeModal()">&times;</div>
            <img id="modalImage" class="modal-image" src="" alt="CG图片">
        </div>
    </div>

    <script>
        // 从配置中加载CG数据
        const cgData = window.GAME_COLLECTION_CONFIG?.cgGallery || [];
        
        // 从配置中加载剧情数据
        const collectionStoryData = window.GAME_COLLECTION_CONFIG?.storyReview || [];
        
        // 初始化游戏状态（避免与全局 gameState 冲突，使用 collectionGameState）
        let collectionGameState = null;
        
        // 初始化页面
        function initPage() {
            console.log('📄 收藏图鉴页面初始化...');
            
            // 加载背景图片并添加详细日志
            if (typeof window.GAME_RESOURCES_CONFIG !== 'undefined' && window.GAME_RESOURCES_CONFIG.backgrounds) {
                const bgImg = document.getElementById('pageBackground');
                const bgPath = window.GAME_RESOURCES_CONFIG.backgrounds.throne_room || '';
                console.log('🖼️ 尝试加载背景图:', bgPath);
                
                bgImg.onerror = function() {
                    console.error('❌ 背景图加载失败:', bgPath);
                    console.error('   完整URL:', this.src);
                };
                bgImg.onload = function() {
                    console.log('✅ 背景图加载成功:', bgPath);
                };
                
                bgImg.src = bgPath;
            } else {
                console.error('❌ 未找到 GAME_RESOURCES_CONFIG 或 backgrounds 配置');
                console.log('   window.GAME_RESOURCES_CONFIG =', window.GAME_RESOURCES_CONFIG);
            }
            
            loadGameData();
            updateCGGallery();
            updateStoryList();
            updateStats();
            animateElements();
        }
        
        // 加载游戏数据
        function loadGameData() {
            // 优先从全局 GameStateManager 获取状态
            if (window.gameState && typeof window.gameState.getState === 'function') {
                collectionGameState = window.gameState.getState();
                console.log('✅ 从 GameStateManager 加载状态');
            } else {
                // 如果没有 gameState，从 localStorage 加载
                const saveData = localStorage.getItem('phoenixGameSave');
                if (saveData) {
                    collectionGameState = JSON.parse(saveData);
                    console.log('✅ 从 localStorage 加载状态');
                } else {
                    // 创建默认状态
                    collectionGameState = {
                        stats: { wisdom: 0, courage: 0, insight: 0, charm: 0 },
                        affection: { gu: 0, xiao: 0, han: 0 },
                        choices: [],
                        chapter: 1,
                        playTime: 0,
                        unlockedCG: [],
                        unlockedStory: []
                    };
                    console.log('⚠️ 使用默认游戏状态');
                }
            }
            
            // 根据游戏进度解锁内容
            updateUnlocks();
        }
        
        // 根据游戏进度更新解锁状态
        function updateUnlocks() {
            // 根据选择数量解锁内容
            const choiceCount = collectionGameState.choices.length;
            
            if (choiceCount >= 1) {
                if (!collectionGameState.unlockedCG.includes('cold_palace')) {
                    collectionGameState.unlockedCG.push('cold_palace');
                }
                if (!collectionGameState.unlockedStory.includes('scene1')) {
                    collectionGameState.unlockedStory.push('scene1');
                }
            }
            
            if (choiceCount >= 2) {
                if (!collectionGameState.unlockedCG.includes('medical_hall')) {
                    collectionGameState.unlockedCG.push('medical_hall');
                }
                if (!collectionGameState.unlockedStory.includes('scene2')) {
                    collectionGameState.unlockedStory.push('scene2');
                }
            }
            
            if (choiceCount >= 3) {
                if (!collectionGameState.unlockedCG.includes('imperial_garden')) {
                    collectionGameState.unlockedCG.push('imperial_garden');
                }
                if (!collectionGameState.unlockedStory.includes('scene3')) {
                    collectionGameState.unlockedStory.push('scene3');
                }
            }
            
            if (choiceCount >= 4) {
                if (!collectionGameState.unlockedCG.includes('study_room')) {
                    collectionGameState.unlockedCG.push('study_room');
                }
                if (!collectionGameState.unlockedStory.includes('scene4')) {
                    collectionGameState.unlockedStory.push('scene4');
                }
                if (!collectionGameState.unlockedCG.includes('throne_room')) {
                    collectionGameState.unlockedCG.push('throne_room');
                }
            }
        }
        
        // 切换标签页
        function switchTab(tabName) {
            // 移除所有活动状态
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // 激活选中的标签页
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
        
        // 更新CG图鉴
        function updateCGGallery() {
            const cgGrid = document.getElementById('cgGrid');
            
            if (collectionGameState.unlockedCG.length === 0) {
                cgGrid.innerHTML = '<div class="empty-state">暂无解锁的CG图片<br>开始游戏来解锁精美插画吧</div>';
                return;
            }
            
            cgGrid.innerHTML = '';
            
            cgData.forEach(cg => {
                const isUnlocked = collectionGameState.unlockedCG.includes(cg.id);
                const cgItem = createCGItem(cg, isUnlocked);
                cgGrid.appendChild(cgItem);
            });
        }
        
        // 创建CG项目
        function createCGItem(cg, isUnlocked) {
            const item = document.createElement('div');
            item.className = `cg-item ${isUnlocked ? '' : 'locked'}`;
            
            if (isUnlocked) {
                item.innerHTML = `
                    <img src="${cg.image}" alt="${cg.title}" class="cg-image">
                    <div class="cg-info">
                        <div class="cg-title">${cg.title}</div>
                        <div class="cg-description">${cg.description}</div>
                    </div>
                `;
                item.onclick = () => openModal(cg.image);
            } else {
                item.innerHTML = `
                    <div class="cg-lock">🔒</div>
                    <div class="cg-info">
                        <div class="cg-title">???</div>
                        <div class="cg-description">${cg.unlockCondition}</div>
                    </div>
                `;
            }
            
            return item;
        }
        
        // 更新剧情列表
        function updateStoryList() {
            const storyList = document.getElementById('storyList');
            
            if (collectionGameState.unlockedStory.length === 0) {
                storyList.innerHTML = '<div class="empty-state">暂无解锁的剧情回顾<br>开始游戏来记录您的冒险吧</div>';
                return;
            }
            
            storyList.innerHTML = '';
            
            collectionStoryData.forEach(story => {
                const isUnlocked = collectionGameState.unlockedStory.includes(story.id);
                const storyItem = createStoryItem(story, isUnlocked);
                storyList.appendChild(storyItem);
            });
        }
        
        // 创建剧情项目
        function createStoryItem(story, isUnlocked) {
            const item = document.createElement('div');
            item.className = `story-item ${isUnlocked ? '' : 'locked'}`;
            
            if (isUnlocked) {
                item.innerHTML = `
                    <div class="story-title">${story.title}</div>
                    <div class="story-meta">${story.scene} | ${story.unlockCondition}</div>
                    <div class="story-preview">${story.preview}</div>
                `;
                item.onclick = () => replayStory(story.id);
            } else {
                item.innerHTML = `
                    <div class="story-title">???</div>
                    <div class="story-meta">未解锁</div>
                    <div class="story-preview">${story.unlockCondition}</div>
                `;
            }
            
            return item;
        }
        
        // 更新统计信息
        function updateStats() {
            const statsGrid = document.getElementById('statsGrid');
            
            const stats = [
                {
                    label: '游戏进度',
                    value: `${Math.min(collectionGameState.choices.length * 25, 100)}%`,
                    icon: '📊'
                },
                {
                    label: '解锁CG',
                    value: `${collectionGameState.unlockedCG.length}/${cgData.length}`,
                    icon: '🖼️'
                },
                {
                    label: '解锁剧情',
                    value: `${collectionGameState.unlockedStory.length}/${collectionStoryData.length}`,
                    icon: '📖'
                },
                {
                    label: '总选择数',
                    value: collectionGameState.choices.length,
                    icon: '🎯'
                },
                {
                    label: '智慧总值',
                    value: collectionGameState.stats.wisdom,
                    icon: '🧠'
                },
                {
                    label: '勇气总值',
                    value: collectionGameState.stats.courage,
                    icon: '💪'
                },
                {
                    label: '洞察总值',
                    value: collectionGameState.stats.insight,
                    icon: '👁️'
                },
                {
                    label: '魅力总值',
                    value: collectionGameState.stats.charm,
                    icon: '✨'
                }
            ];
            
            statsGrid.innerHTML = stats.map(stat => `
                <div class="stats-card">
                    <div class="stats-number">${stat.value}</div>
                    <div class="stats-label">${stat.icon} ${stat.label}</div>
                </div>
            `).join('');
        }
        
        // 打开模态框
        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            
            modalImage.src = imageSrc;
            modal.classList.add('active');
            
            // 禁止背景滚动
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭模态框
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            
            // 恢复背景滚动
            document.body.style.overflow = 'auto';
        }
        
        // 重播剧情
        function replayStory(storyId) {
            // 这里可以实现跳转到指定剧情的功能
            alert('剧情重播功能开发中...');
        }
        
        // 添加动画效果
        function animateElements() {
            anime({
                targets: '.section, .cg-item, .story-item, .stats-card',
                translateY: [50, 0],
                opacity: [0, 1],
                delay: anime.stagger(100),
                duration: 800,
                easing: 'easeOutQuart'
            });
        }
        
        // 点击模态框背景关闭
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        // ESC键关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
