<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凤临朝：穿越之权倾天下</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- 游戏配置数据 - 必须在main.js之前引入 -->
    <script src="game-data.js"></script>
    <script src="main.js"></script>
    
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #2F4F4F 0%, #1a1a1a 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .title-text {
            background: linear-gradient(45deg, #D4AF37, #FFD700, #D4AF37);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .floating-petals {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.6), rgba(139, 0, 0, 0.3));
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .menu-button {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.9), rgba(139, 0, 0, 0.8));
            border: 2px solid #D4AF37;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .menu-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.9), rgba(139, 69, 19, 0.8));
        }
        
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.4;
        }
        
        .game-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .subtitle {
            color: #D4AF37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 3rem;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
        
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            margin-top: 2rem;
        }
        
        .version-info {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            color: rgba(212, 175, 55, 0.7);
            font-size: 0.8rem;
        }
        
        .loading-text {
            color: #D4AF37;
            font-size: 1rem;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeInOut 2s ease-in-out infinite;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <img id="pageBackground" src="" alt="Background" class="background-image">
    
    <div class="floating-petals" id="petals"></div>
    
    <div class="game-container">
        <h1 class="title-text text-6xl font-bold mb-4 text-center leading-tight">
            凤临朝
        </h1>
        <div class="subtitle text-center">
            穿越之权倾天下
        </div>
        
        <div class="menu-container">
            <button id="startBtn" class="menu-button px-8 py-4 rounded-lg text-white font-semibold text-xl min-w-64">
                开始游戏
            </button>
            <button id="continueBtn" class="menu-button px-8 py-4 rounded-lg text-white font-semibold text-xl min-w-64">
                继续游戏
            </button>
            <button id="characterBtn" class="menu-button px-8 py-4 rounded-lg text-white font-semibold text-xl min-w-64">
                角色信息
            </button>
            <button id="collectionBtn" class="menu-button px-8 py-4 rounded-lg text-white font-semibold text-xl min-w-64">
                收藏图鉴
            </button>
        </div>
        
        <div class="loading-text" id="loadingText">
            正在加载游戏资源...
        </div>
    </div>
    
    <div class="version-info">
        版本 1.0 | 本故事纯属虚构
    </div>

    <script>
        // 创建飘落花瓣效果
        function createPetals() {
            const petalsContainer = document.getElementById('petals');
            
            for (let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 10 + 15) + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                petal.style.transform = `scale(${Math.random() * 0.5 + 0.5})`;
                petalsContainer.appendChild(petal);
            }
        }
        
        // 按钮动画效果
        function animateButtons() {
            const buttons = document.querySelectorAll('.menu-button');
            
            anime({
                targets: buttons,
                translateY: [50, 0],
                opacity: [0, 1],
                delay: anime.stagger(200, {start: 500}),
                duration: 800,
                easing: 'easeOutQuart'
            });
        }
        
        // 检查游戏存档
        function checkSaveData() {
            const saveData = localStorage.getItem('phoenixGameSave');
            const continueBtn = document.getElementById('continueBtn');
            
            if (saveData) {
                continueBtn.style.display = 'block';
            } else {
                continueBtn.style.display = 'none';
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 加载背景图片
            if (typeof window.GAME_RESOURCES_CONFIG !== 'undefined' && window.GAME_RESOURCES_CONFIG.backgrounds) {
                const bgImg = document.getElementById('pageBackground');
                bgImg.src = window.GAME_RESOURCES_CONFIG.backgrounds.imperial_garden || '';
            }
            
            createPetals();
            animateButtons();
            checkSaveData();
            
            // 隐藏加载文字
            setTimeout(() => {
                document.getElementById('loadingText').style.display = 'none';
            }, 2000);
        });
        
        // 按钮点击事件
        document.getElementById('startBtn').addEventListener('click', function() {
            // 开始新游戏
            localStorage.removeItem('phoenixGameSave');
            localStorage.setItem('gameStarted', 'true');
            window.location.href = 'story.html';
        });
        
        document.getElementById('continueBtn').addEventListener('click', function() {
            // 继续游戏
            window.location.href = 'story.html';
        });
        
        document.getElementById('characterBtn').addEventListener('click', function() {
            window.location.href = 'character.html';
        });
        
        document.getElementById('collectionBtn').addEventListener('click', function() {
            window.location.href = 'collection.html';
        });
        
        // 添加按钮点击音效（模拟）
        document.querySelectorAll('.menu-button').forEach(button => {
            button.addEventListener('click', function() {
                // 这里可以添加实际的音效播放代码
                console.log('按钮点击音效');
            });
        });
    </script>
</body>
</html>
